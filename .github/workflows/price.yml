name: Uppdatera aktiekurs
on:
  schedule:
    # Weekdays, covering the Stockholm trading session in both CET and CEST.
    - cron: '*/15 6-18 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-isofol-price
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hämta fördröjd aktiekurs
        run: python scripts/update_price.py
      - name: Spara uppdaterad kurs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ISOFOL share price"
            git pull --rebase
            git push
          fi
