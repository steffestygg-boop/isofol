name: Publish Isofol Tracker to GitHub Pages
on:
  # Kursjobbets git push använder GITHUB_TOKEN och utlöser därför inte ett nytt push-flöde.
  # Publicera om GitHub Pages när kursjobbet slutförts framgångsrikt.
  workflow_run:
    workflows: ["Uppdatera Isofol Medical aktiekurs", "Uppdatera nyheter"]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check out the shared Mina Aktier frontend
        uses: actions/checkout@v4
        with:
          repository: steffestygg-boop/synact
          ref: main
          path: .mina-aktier-layout
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/navigation.js
            /assets/overview.css
            /assets/week.js
            /layout/
            /scripts/render_layout.py
      - name: Use the common layout, styles and news renderer
        shell: bash
        run: |
          mv .mina-aktier-layout "$RUNNER_TEMP/mina-aktier-layout"
          common="$RUNNER_TEMP/mina-aktier-layout"
          cp "$common"/assets/{navigation.js,overview.css,week.js} assets/
          cp "$common"/layout/*.html layout/
          cp "$common"/scripts/render_layout.py scripts/
      - name: Render common layout and section links
        run: python3 scripts/render_layout.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Vänta på uppladdat webbpaket
        run: sleep 15
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
